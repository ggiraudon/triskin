; Triskin - mouse jiggler for the Waveshare RP2350-Touch-LCD-2
;
; There is no board definition for this board, so we build on the generic
; Pico 2 one and override what differs. All pins live in src/board/pins.h.
; Do not use LED_BUILTIN: on rpipico2 it is GPIO25, which is the SD card CS here.

[env:rp2350_touch_lcd_2]
; Pinned so the toolchain cannot change under us. This commit ships
; arduino-pico 6.1.0 (Pico SDK 2.3.0).
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipico2
framework = arduino
board_build.core = earlephilhower
board_upload.maximum_size = 16777216
board_build.filesystem_size = 1m
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@9.5.0
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
extra_scripts = pre:tools/upload_port.py
